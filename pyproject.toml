[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regulus"
version = "0.1.0"
description = "Heterogeneous graph learning for functional-regulatory cell representations"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yang Li" }]
keywords = ["single-cell", "gene-regulatory-network", "heterogeneous-graph", "cellular-function"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.21",
    "pandas>=1.3",
    "pyyaml>=5.4",
    "torch>=2.0",
    "torch-geometric>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
regulus = "regulus.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["regulus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
