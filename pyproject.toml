[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regulus"
version = "1.0.0"
description = "Regulus: interpretable perturbation driver inference and virtual functional manipulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yang Li" }]
keywords = ["single-cell", "perturbation", "gene-regulatory-network"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "matplotlib>=3.5",
    "networkx>=2.6",
    "numpy>=1.21",
    "pandas>=1.3",
    "pyyaml>=5.4",
    "scanpy>=1.9",
    "scipy>=1.7",
    "torch>=2.0",
    "torch-geometric>=2.3",
    "tqdm>=4.60",
    "pyucell>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]
knowledge = [
    "joblib>=1.1",
    "scikit-learn>=1.0",
    "transformers>=4.30",
]

[project.scripts]
regulus = "regulus.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["regulus*"]

[tool.setuptools.package-data]
regulus = ["assets/**/*.json", "assets/**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
