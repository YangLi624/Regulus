data:
  dataset_dir: data/joung_tfatlas
  train_data: TFAtlas_full_raw720_post_state_cfo.h5ad
  graph_asset_dir: assets/graph/regulus_graph_v1
  gene_universe: assets/graph/regulus_graph_v1/universes/gene_universe.csv

model:
  representation: post_state
  channels: cfo
  head: prototype_matching
  graph_checkpoint: models/regulus_graph_v1.pt
  d_cond: 128
  gene_topk: 2048
  cfo_topk: 256
  layers: 2
  heads: 4
  dropout: 0.1
  use_bilinear: true
  learnable_temperature: true
  temperature_init: 1.0

training:
  loss: cross_entropy
  learning_rate: 0.001
  batch_size: 128
  epochs: 100
  mixed_precision: true
  grad_clip_norm: 1.0
  checkpoint_interval: 5000
  log_interval: 10
  random_seed: 20260628
  lr_scheduler:
    type: warmup_cosine
    warmup_steps: 500
    min_lr: 1.0e-6

output_dir: outputs/joung_tfatlas
checkpoint_dir: outputs/joung_tfatlas/checkpoints
resume: false
